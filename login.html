<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRACKPO — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0D0D0D;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrapper { width: 100%; max-width: 420px; padding: 24px; }
    .login-logo { text-align: center; margin-bottom: 40px; }
    .login-logo h1 { font-size: 32px; font-weight: 700; color: #C9A84C; letter-spacing: 4px; }
    .login-logo p { font-size: 13px; color: #8A8A8A; margin-top: 6px; }
    .login-card { background: #1A1A1A; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .login-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .login-card p { font-size: 13px; color: #8A8A8A; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; color: #8A8A8A; margin-bottom: 8px; }
    .form-group input {
      width: 100%; padding: 14px 16px;
      background: #0D0D0D; border: 1px solid #2A2A2A;
      border-radius: 12px; color: #FFFFFF; font-size: 15px;
      outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #C9A84C; }
    .form-group input::placeholder { color: #444; }
    .btn-login {
      width: 100%; padding: 15px;
      background: #C9A84C; color: #0D0D0D;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3);
      color: #F85149; padding: 12px 16px; border-radius: 10px;
      font-size: 13px; margin-bottom: 20px; display: none;
    }
    .footer-text { text-align: center; font-size: 12px; color: #444; margin-top: 28px; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.3); border-top-color: #0D0D0D;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <h1>TRACKPO</h1>
      <p>Dashboard Reporting — Aipromarketing</p>
    </div>
    <div class="login-card">
      <h2>Selamat Datang</h2>
      <p>Masukkan maklumat log masuk anda</p>
      <div class="error-msg" id="errorMsg"></div>
      <div class="form-group">
        <label>Email / Username</label>
        <input type="text" id="inputLogin" placeholder="email@domain.com atau username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="inputPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-login" id="btnLogin" onclick="handleLogin()">Log Masuk</button>
    </div>
    <p class="footer-text">TRACKPO v2 &copy; 2026 Aipromarketing</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dhyddyhbpmzstbhrsgrq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_krPrYN9no79aBlSbKiXsmw_3VuyxrN';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin() {
      const input = document.getElementById('inputLogin').value.trim();
      const password = document.getElementById('inputPassword').value;
      const btn = document.getElementById('btnLogin');
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';
      if (!input || !password) { showError('Sila isi semua maklumat.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Sedang log masuk...';

      const email = input.includes('@') ? input : `${input}@trackpo.app`;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showError('Email/username atau password salah. Sila cuba semula.');
        btn.disabled = false;
        btn.innerHTML = 'Log Masuk';
        return;
      }

      const { data: profile } = await sb
        .from('profiles').select('role').eq('id', data.user.id).single();

      window.location.href = profile?.role === 'admin' ? 'admin.html' : 'index.html';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        sb.from('profiles').select('role').eq('id', session.user.id).single()
          .then(({ data: profile }) => {
            window.location.href = profile?.role === 'admin' ? 'admin.html' : 'index.html';
          });
      }
    });
  </script>
</body>
</html>
