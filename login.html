<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRACKPO — Log Masuk</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <meta name="theme-color" content="#6C63FF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TRACKPO" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #F0EFFF;
      color: #1A1A2E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-mark {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #6C63FF, #5A52E0);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: #fff;
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(108,99,255,0.3);
    }

    .login-logo h1 {
      font-size: 24px; font-weight: 800;
      color: #1A1A2E;
      letter-spacing: -0.5px;
    }

    .login-logo p {
      font-size: 13px;
      color: #6E6E8F;
      margin-top: 4px;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.1);
    }

    .login-card h2 {
      font-size: 20px; font-weight: 700;
      margin-bottom: 6px; letter-spacing: -0.3px;
    }

    .login-card p {
      font-size: 13px; color: #6E6E8F;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: #6E6E8F;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: #F5F5FF;
      border: 1px solid rgba(108,99,255,0.15);
      border-radius: 12px;
      color: #1A1A2E;
      font-size: 14px; font-family: inherit;
      outline: none;
      transition: all 0.15s;
    }

    .form-group input:focus {
      border-color: #6C63FF;
      box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
      background: #fff;
    }

    .form-group input::placeholder { color: #AEAEC8; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6C63FF, #5A52E0);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      margin-top: 8px;
      box-shadow: 0 4px 16px rgba(108,99,255,0.3);
    }

    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #EF4444;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: #AEAEC8;
      margin-top: 28px;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <div class="logo-mark">T</div>
      <h1>TRACKPO</h1>
      <p>Dashboard Reporting — Aipromarketing</p>
    </div>

    <div class="login-card">
      <h2>Selamat Datang 👋</h2>
      <p>Masukkan maklumat log masuk anda</p>

      <div class="error-msg" id="errorMsg"></div>

      <div class="form-group">
        <label>Email / Username</label>
        <input type="text" id="inputLogin" placeholder="email@domain.com atau username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="inputPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn-login" id="btnLogin" onclick="handleLogin()">Log Masuk</button>
    </div>

    <p class="footer-text">TRACKPO v2 &copy; 2026 Aipromarketing</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dhyddyhbpmzstbhrsgrq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoeWRkeWhicG16c3RiaHJzZ3JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MDg5MDMsImV4cCI6MjA5OTQ4NDkwM30.czIG6b_zWhZlFj3MNfFVv6Yb65cL5DD_7yLmV37rFCM';    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin() {
      const input = document.getElementById('inputLogin').value.trim();
      const password = document.getElementById('inputPassword').value;
      const btn = document.getElementById('btnLogin');
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';
      if (!input || !password) { showError('Sila isi semua maklumat.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Sedang log masuk...';

      const email = input.includes('@') ? input : `${input}@trackpo.app`;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showError('Email/username atau password salah. Sila cuba semula.');
        btn.disabled = false;
        btn.innerHTML = 'Log Masuk';
        return;
      }

      const { data: profile } = await sb
        .from('profiles').select('role').eq('id', data.user.id).single();

      window.location.href = profile?.role === 'admin' ? 'admin.html' : 'index.html';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        sb.from('profiles').select('role').eq('id', session.user.id).single()
          .then(({ data: profile }) => {
            window.location.href = profile?.role === 'admin' ? 'admin.html' : 'index.html';
          });
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
